name: Refresh dentistry PQ data

on:
  push:
    branches: [main]
    paths:
      - "config.js"
      - "scripts/refresh-data.mjs"
      - ".github/workflows/refresh-data.yml"
  workflow_dispatch:
  schedule:
    # Primary 06:00 UK refresh, plus off-hour catch-ups if GitHub misses it.
    - cron: "0 6 * * *"
      timezone: "Europe/London"
    - cron: "17 6,7 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

# Serialise refreshes so they cannot overwrite each other.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether today's scheduled refresh is already complete
        id: freshness
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const ukDate = value => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London' }).format(new Date(value));
          let alreadyFresh = false;
          try {
            const status = JSON.parse(readFileSync('data/refresh-status.json', 'utf8'));
            const hour = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', hourCycle: 'h23' }).format(new Date(status.refreshedAt)));
            alreadyFresh = ukDate(status.refreshedAt) === ukDate(Date.now()) && hour >= 6;
          } catch {}
          const run = process.env.TRIGGER_EVENT !== 'schedule' || !alreadyFresh;
          appendFileSync(process.env.GITHUB_OUTPUT, 'run=' + run + '\n');
          console.log(run ? 'Refresh required.' : 'Already refreshed today; skipping scheduled catch-up.');
          NODE
      - uses: actions/setup-node@v4
        if: steps.freshness.outputs.run == 'true'
        with:
          node-version: "24"
      - name: Refresh committed dashboard data
        if: steps.freshness.outputs.run == 'true'
        env:
          # Lets the refresh decrypt the committed .enc to find its prior state and
          # run the fast incremental path instead of a full rebuild every run.
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
          # Pace the (now rare) full-rebuild answer enrichment to avoid the
          # Cloudflare rate limit; incremental runs only enrich a handful.
          ANSWER_CONCURRENCY: "2"
          ANSWER_DELAY_MS: "250"
        run: node scripts/refresh-data.mjs
      - name: Encrypt data files
        if: steps.freshness.outputs.run == 'true'
        env:
          PQ_PASSWORD: ${{ secrets.PQ_PASSWORD }}
        run: node scripts/encrypt-data.mjs
      - name: Record successful refresh time
        if: steps.freshness.outputs.run == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('data/refresh-status.json', JSON.stringify({ refreshedAt: new Date().toISOString() }) + '\n');
          NODE
      - name: Commit data changes
        if: steps.freshness.outputs.run == 'true'
        run: |
          git add -A data/dentistry data/constituency-regions.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No dentistry PQ data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh dentistry PQ dashboard data"
          # A push straight after the commit fails if anything landed on main while the
          # refresh was running — a merge, or another fire of this workflow. Rebase onto
          # whatever arrived and retry; the data is derived, so nothing can conflict.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying."
            git pull --rebase origin main
          done
          echo "Could not push the refreshed data after 3 attempts."
          exit 1
